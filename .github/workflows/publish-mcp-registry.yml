name: Publish to Official MCP Registry

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.10/mcp-publisher_linux_amd64.tar.gz" -o /tmp/mp.tar.gz
          tar -xzf /tmp/mp.tar.gz -C /tmp
          sudo install -m 0755 /tmp/mcp-publisher /usr/local/bin/mcp-publisher
      - name: Authenticate via GitHub OIDC and publish server.json
        run: |
          mcp-publisher login github-oidc
          mcp-publisher publish
